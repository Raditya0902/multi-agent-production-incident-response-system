services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - chroma_data:/app/rag/chroma_db
      - app_data:/app/data_storage
    environment:
      # Override so the DB lands in the persistent volume, not the container layer
      - INCIDENT_DB_PATH=/app/data_storage/incidents.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data:
  app_data:
