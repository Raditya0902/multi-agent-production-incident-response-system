services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - chroma_data:/app/rag/chroma_db
      - app_data:/app/data_storage
    environment:
      - INCIDENT_DB_PATH=/app/data_storage/incidents.db
      - HITL_DB_PATH=/app/data_storage/hitl.db
      # Compose services have no Docker daemon access for per-run containers.
      - SANDBOX_MODE=subprocess
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    build: .
    entrypoint: ["uvicorn", "api.webhook:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/rag/chroma_db
      - app_data:/app/data_storage
    environment:
      - INCIDENT_DB_PATH=/app/data_storage/incidents.db
      # Compose services have no Docker daemon access for per-run containers.
      - SANDBOX_MODE=subprocess
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
  app_data:
